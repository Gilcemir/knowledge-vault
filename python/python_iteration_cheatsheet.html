<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Iteration Cheat Sheet</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f3;
    --bg-tertiary: #efefed;
    --text-primary: #1a1a18;
    --text-secondary: #6b6b68;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
    --purple-bg: #EEEDFE; --purple-text: #3C3489;
    --green-bg: #EAF3DE; --green-text: #3B6D11;
    --blue-bg: #E6F1FB; --blue-text: #0C447C;
    --amber-bg: #FAEEDA; --amber-text: #633806;
    --accent: #7F77DD;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1c;
      --bg-secondary: #282826;
      --bg-tertiary: #323230;
      --text-primary: #f0ede8;
      --text-secondary: #9a9895;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.20);
      --purple-bg: #26215C; --purple-text: #CECBF6;
      --green-bg: #173404; --green-text: #C0DD97;
      --blue-bg: #042C53; --blue-text: #B5D4F4;
      --amber-bg: #412402; --amber-text: #FAC775;
    }
  }
  body {
    font-family: var(--font-sans);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }
  .container { max-width: 960px; margin: 0 auto; }
  header { margin-bottom: 2rem; }
  header h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  header p { font-size: 14px; color: var(--text-secondary); }
  .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .filter-btn {
    font-size: 11px; font-weight: 500; padding: 5px 12px;
    border-radius: 20px; border: 0.5px solid var(--border-strong);
    background: transparent; color: var(--text-secondary);
    cursor: pointer; letter-spacing: 0.03em; font-family: var(--font-sans);
    transition: background 0.15s, color 0.15s;
  }
  .filter-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
  .filter-btn.active { background: var(--purple-bg); color: var(--purple-text); border-color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; cursor: pointer; user-select: none;
  }
  .card-header:hover { background: var(--bg-secondary); }
  .card-label { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .badge {
    font-size: 10px; font-weight: 500; padding: 2px 8px;
    border-radius: 20px; letter-spacing: 0.03em;
  }
  .badge-loops { background: var(--blue-bg); color: var(--blue-text); }
  .badge-builtins { background: var(--green-bg); color: var(--green-text); }
  .badge-itertools { background: var(--purple-bg); color: var(--purple-text); }
  .badge-generators { background: var(--amber-bg); color: var(--amber-text); }
  .chevron { font-size: 10px; color: var(--text-secondary); transition: transform 0.2s; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }
  .card-body { display: none; border-top: 0.5px solid var(--border); }
  .card-body.open { display: block; }
  .tab-bar { display: flex; border-bottom: 0.5px solid var(--border); }
  .tab {
    padding: 7px 14px; font-size: 12px; color: var(--text-secondary);
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -0.5px;
    font-family: var(--font-sans);
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--text-primary); font-weight: 500; border-bottom-color: var(--accent); }
  .tab-content { display: none; padding: 12px 14px; }
  .tab-content.active { display: block; }
  pre {
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    padding: 11px 13px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.65;
    overflow-x: auto;
    color: var(--text-primary);
  }
  .tip {
    margin-top: 8px; padding: 7px 10px;
    background: var(--purple-bg);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    font-size: 12px; color: var(--purple-text); line-height: 1.5;
  }
  .warn {
    margin-top: 8px; padding: 7px 10px;
    background: var(--amber-bg);
    border-left: 3px solid #EF9F27;
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    font-size: 12px; color: var(--amber-text); line-height: 1.5;
  }
  .note { margin-top: 8px; font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
  .section-title {
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-secondary);
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Python iteration cheat sheet</h1>
    <p>For Java/C# engineers — each card has a Python tab and a vs Java comparison tab.</p>
  </header>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="loops">Loops</button>
    <button class="filter-btn" data-filter="builtins">Builtins</button>
    <button class="filter-btn" data-filter="itertools">itertools</button>
    <button class="filter-btn" data-filter="generators">Generators</button>
  </div>

  <div class="cards" id="cardGrid"></div>
</div>

<script>
const data = [
  {
    id: "for-basic", cat: "loops", label: "for loop basics", badge: "loops", badgeClass: "badge-loops",
    tabs: [
      { label: "Python", code: `# Simple range
for i in range(5):         # 0,1,2,3,4
    print(i)

# Range with start/stop/step
for i in range(2, 10, 2):  # 2,4,6,8
    print(i)

# Iterate directly over a list
fruits = ["apple", "banana", "cherry"]
for fruit in fruits:
    print(fruit)` },
      { label: "vs Java", code: `// Java for-i  →  Python range()
for (int i = 0; i < 5; i++)      → for i in range(5):
for (int i = 2; i < 10; i += 2)  → for i in range(2, 10, 2):

// Java for-each  →  Python for-in
for (String s : list)   →   for s in list:` }
    ],
    note: "Python has no C-style for(;;). Use range() when you need an index.",
  },
  {
    id: "while-loop", cat: "loops", label: "while & loop control", badge: "loops", badgeClass: "badge-loops",
    tabs: [
      { label: "Python", code: `# while
n = 10
while n > 0:
    n -= 2       # no n-- in Python!

# break / continue  (same as Java/C#)
for i in range(10):
    if i == 3: continue
    if i == 7: break

# for...else  (runs if loop wasn't broken)
for i in range(5):
    if i == 99:
        break
else:
    print("never broke out")` },
      { label: "vs Java", code: `// No do-while in Python.
// Simulate with:
while True:
    # ...body...
    if condition:
        break

// for...else has no Java equivalent.
// Runs the else block only if the loop
// completed without hitting break.` }
    ],
    tip: "for...else is unique to Python. The else block runs only if the loop wasn't exited with break.",
  },
  {
    id: "enumerate", cat: "builtins", label: "enumerate()", badge: "builtins", badgeClass: "badge-builtins",
    tabs: [
      { label: "Python", code: `items = ["a", "b", "c"]

# Get index + value together
for i, val in enumerate(items):
    print(i, val)    # 0 a, 1 b, 2 c

# Start counting from 1
for i, val in enumerate(items, start=1):
    print(i, val)    # 1 a, 2 b, 3 c` },
      { label: "vs Java", code: `// Java: manual counter or indexed loop
int i = 0;
for (String val : list) { ...; i++; }

// Python: just use enumerate()
for i, val in enumerate(list):
    ...` }
    ],
    tip: "Prefer enumerate() over range(len(list)). It's idiomatic Python.",
  },
  {
    id: "zip", cat: "builtins", label: "zip()", badge: "builtins", badgeClass: "badge-builtins",
    tabs: [
      { label: "Python", code: `names  = ["Alice", "Bob", "Carol"]
scores = [90, 85, 92]

# Iterate two lists in parallel
for name, score in zip(names, scores):
    print(f"{name}: {score}")

# Zip 3+ iterables
for a, b, c in zip([1,2], [3,4], [5,6]):
    print(a, b, c)

# Unzip (transpose)
pairs = [(1,"a"), (2,"b"), (3,"c")]
nums, letters = zip(*pairs)` },
      { label: "vs Java", code: `// Java has no zip() — you'd use index:
for (int i = 0; i < names.size(); i++) {
    System.out.println(names.get(i) + scores.get(i));
}

// Python:
for name, score in zip(names, scores):
    print(f"{name}: {score}")` }
    ],
    warn: "zip() stops at the shortest iterable. Use itertools.zip_longest() to pad with None instead.",
  },
  {
    id: "map-filter", cat: "builtins", label: "map() & filter()", badge: "builtins", badgeClass: "badge-builtins",
    tabs: [
      { label: "Python", code: `nums = [1, 2, 3, 4, 5]

# map() — transform every element
doubled = list(map(lambda x: x * 2, nums))
# [2, 4, 6, 8, 10]

# filter() — keep matching elements
evens = list(filter(lambda x: x % 2 == 0, nums))
# [2, 4]

# Chain them
result = list(map(lambda x: x**2,
               filter(lambda x: x > 2, nums)))
# [9, 16, 25]` },
      { label: "vs Java", code: `// Java Streams  →  Python map/filter
list.stream().map(x -> x * 2)
    .collect(toList());
// Python:
list(map(lambda x: x * 2, nums))

// Java predicate filter:
list.stream().filter(x -> x % 2 == 0)
// Python:
list(filter(lambda x: x % 2 == 0, nums))` }
    ],
    tip: "In Python, list comprehensions are usually preferred over map/filter. Both work; comps are more readable.",
  },
  {
    id: "list-comp", cat: "builtins", label: "list & dict comprehensions", badge: "builtins", badgeClass: "badge-builtins",
    tabs: [
      { label: "Python", code: `# Basic: [expression for item in iterable]
squares = [x**2 for x in range(10)]

# With filter: [... if condition]
evens = [x for x in range(10) if x % 2 == 0]

# Nested loops
pairs = [(x, y) for x in [1,2] for y in [3,4]]
# [(1,3),(1,4),(2,3),(2,4)]

# Dict comprehension
d = {k: v for k, v in zip("abc", [1,2,3])}
# {'a':1, 'b':2, 'c':3}

# Set comprehension
unique_lens = {len(w) for w in ["hi","hey","yo"]}` },
      { label: "vs Java", code: `// Java Streams (verbose):
list.stream()
    .filter(x -> x % 2 == 0)
    .map(x -> x * x)
    .collect(toList());

// Python list comprehension (clean):
[x*x for x in nums if x % 2 == 0]

// Dict comp ≈ Java's Collectors.toMap()
// Set comp  ≈ .collect(Collectors.toSet())` }
    ],
    tip: "The order is [expr FOR item IN iterable IF cond] — the filter clause comes AFTER the for.",
  },
  {
    id: "unpacking", cat: "loops", label: "unpacking & starred assignment", badge: "loops", badgeClass: "badge-loops",
    tabs: [
      { label: "Python", code: `# Tuple unpacking in a loop
pairs = [(1,"a"), (2,"b"), (3,"c")]
for num, letter in pairs:
    print(num, letter)

# Starred unpacking
first, *rest = [1, 2, 3, 4, 5]
# first=1, rest=[2,3,4,5]

*start, last = [1, 2, 3, 4, 5]
# start=[1,2,3,4], last=5

a, *mid, z = [1, 2, 3, 4, 5]
# a=1, mid=[2,3,4], z=5

# Swap without temp var
x, y = 10, 20
x, y = y, x` },
      { label: "vs Java", code: `// Java has no tuple unpacking or starred.
// You'd destructure manually:
int num = pair[0]; String s = pair[1];

// Python:
for num, letter in pairs:  // clean!

// Swap in Java needs temp var:
int tmp = x; x = y; y = tmp;
// Python:
x, y = y, x   // no temp needed` }
    ],
    tip: "Unpacking works with any iterable. It's heavily used in dict.items(), enumerate(), and zip().",
  },
  {
    id: "dict-iter", cat: "builtins", label: "iterating dicts", badge: "builtins", badgeClass: "badge-builtins",
    tabs: [
      { label: "Python", code: `d = {"a": 1, "b": 2, "c": 3}

# Keys only (default)
for key in d:
    print(key)

# Values only
for val in d.values():
    print(val)

# Key-value pairs
for key, val in d.items():
    print(key, val)

# Sorted by key
for key in sorted(d):
    print(key, d[key])

# Sorted by value
for key, val in sorted(d.items(), key=lambda x: x[1]):
    print(key, val)` },
      { label: "vs Java", code: `// Java Map iteration:
for (Map.Entry<K,V> e : map.entrySet())
    e.getKey() / e.getValue();

// Python equivalent:
for key, val in d.items():
    ...

// Java sort by value is verbose.
// Python:
sorted(d.items(), key=lambda x: x[1])` }
    ],
  },
  {
    id: "itertools-chain", cat: "itertools", label: "itertools: chain & islice", badge: "itertools", badgeClass: "badge-itertools",
    tabs: [
      { label: "Python", code: `import itertools

# chain — flatten multiple iterables
a, b = [1, 2], [3, 4]
for x in itertools.chain(a, b):
    print(x)   # 1 2 3 4

# chain.from_iterable — flatten one level
nested = [[1,2],[3,4],[5]]
flat = list(itertools.chain.from_iterable(nested))
# [1, 2, 3, 4, 5]

# islice — lazy slicing (no copy)
gen = (x**2 for x in range(1_000_000))
first5 = list(itertools.islice(gen, 5))
# [0, 1, 4, 9, 16]` },
      { label: "Use cases", code: `# LeetCode patterns:
# chain — combine two arrays without +
# chain.from_iterable — flatten 2D board
# islice — take k elements from generator

# Example: k closest points
import heapq, itertools
heap = [(dist, pt) for dist, pt in points]
heapq.heapify(heap)
result = [p for _, p in itertools.islice(heap, k)]` }
    ],
    note: "itertools functions are lazy — they return iterators, not lists. Wrap in list() to materialize.",
  },
  {
    id: "itertools-combo", cat: "itertools", label: "itertools: combinations & permutations", badge: "itertools", badgeClass: "badge-itertools",
    tabs: [
      { label: "Python", code: `import itertools

nums = [1, 2, 3]

# permutations (ordered arrangements)
list(itertools.permutations(nums, 2))
# [(1,2),(1,3),(2,1),(2,3),(3,1),(3,2)]

# combinations (unordered, no repeat)
list(itertools.combinations(nums, 2))
# [(1,2),(1,3),(2,3)]

# combinations_with_replacement
list(itertools.combinations_with_replacement(nums, 2))
# [(1,1),(1,2),(1,3),(2,2),(2,3),(3,3)]

# product (cartesian — like nested loops)
list(itertools.product([0,1], repeat=3))
# all 3-bit binary combos` },
      { label: "Use cases", code: `# Classic LeetCode use cases:
# permutations → all orderings of k items
# combinations → "choose k from n"
# product      → try all bitmasks / grid moves

# Example: all pairs that sum to target
from itertools import combinations
def two_sum_brute(nums, target):
    return [(a, b) for a, b in combinations(nums, 2)
            if a + b == target]` }
    ],
  },
  {
    id: "itertools-group", cat: "itertools", label: "itertools: groupby, count & cycle", badge: "itertools", badgeClass: "badge-itertools",
    tabs: [
      { label: "Python", code: `import itertools

# groupby — group consecutive identical keys
# ⚠️ must sort first!
data = [("a",1),("b",2),("a",3),("b",4)]
data.sort(key=lambda x: x[0])

for key, group in itertools.groupby(data, key=lambda x: x[0]):
    print(key, list(group))

# count — infinite counter
counter = itertools.count(start=0, step=2)
# 0, 2, 4, 6, ...  use with islice!

# cycle — infinite cycling
for i, val in zip(range(7), itertools.cycle([1,2,3])):
    print(val)   # 1 2 3 1 2 3 1` },
      { label: "Use cases", code: `# groupby → anagram grouping, run-length encoding
# count  → id generation, BFS level numbering
# cycle  → round-robin assignments

# Run-length encoding with groupby:
from itertools import groupby
def rle(s):
    return [(len(list(g)), k)
            for k, g in groupby(s)]

rle("aaabbc")  # [(3,'a'),(2,'b'),(1,'c')]` }
    ],
    warn: "groupby() only groups consecutive elements. Always sort() by the key first!",
  },
  {
    id: "generators", cat: "generators", label: "generator expressions & yield", badge: "generators", badgeClass: "badge-generators",
    tabs: [
      { label: "Python", code: `# Generator expression (lazy, uses () not [])
gen = (x**2 for x in range(1_000_000))
# Nothing computed yet!
next(gen)   # 0
next(gen)   # 1

# Pass directly to sum/min/max
total   = sum(x**2 for x in range(100))
maximum = max(len(s) for s in ["hi","hello","hey"])

# Generator function with yield
def count_up(n):
    i = 0
    while i < n:
        yield i
        i += 1

for val in count_up(5):
    print(val)` },
      { label: "vs Java", code: `// Java: closest is Stream.generate() / iterate()
Stream.iterate(0, i -> i + 1).limit(5)

// Python generator function:
def fib():
    a, b = 0, 1
    while True:
        yield a
        a, b = b, a + b

# Take first 10 fibonacci numbers:
import itertools
list(itertools.islice(fib(), 10))` }
    ],
    tip: "Generators are memory-efficient — they compute values on demand. Use them when you don't need the full list at once.",
  },
];

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderCards(filter) {
  const grid = document.getElementById("cardGrid");
  grid.innerHTML = "";
  const filtered = filter === "all" ? data : data.filter(c => c.cat === filter);
  filtered.forEach(card => {
    const el = document.createElement("div");
    el.className = "card";

    const header = document.createElement("div");
    header.className = "card-header";
    header.innerHTML = `
      <span class="card-label">${card.label}</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <span class="badge ${card.badgeClass}">${card.badge}</span>
        <span class="chevron" id="chev-${card.id}">▼</span>
      </div>`;
    header.onclick = () => toggleCard(card.id);

    const body = document.createElement("div");
    body.className = "card-body";
    body.id = `body-${card.id}`;

    const tabBar = document.createElement("div");
    tabBar.className = "tab-bar";
    card.tabs.forEach((t, i) => {
      const tab = document.createElement("div");
      tab.className = "tab" + (i === 0 ? " active" : "");
      tab.textContent = t.label;
      tab.onclick = (e) => { e.stopPropagation(); switchTab(card.id, i); };
      tabBar.appendChild(tab);
    });
    body.appendChild(tabBar);

    card.tabs.forEach((t, i) => {
      const tc = document.createElement("div");
      tc.className = "tab-content" + (i === 0 ? " active" : "");
      tc.id = `tc-${card.id}-${i}`;
      tc.innerHTML = `<pre>${escapeHtml(t.code)}</pre>`;
      if (i === 0) {
        if (card.tip)  tc.innerHTML += `<div class="tip">✦ ${card.tip}</div>`;
        if (card.warn) tc.innerHTML += `<div class="warn">⚠ ${card.warn}</div>`;
        if (card.note) tc.innerHTML += `<div class="note">${card.note}</div>`;
      }
      body.appendChild(tc);
    });

    el.appendChild(header);
    el.appendChild(body);
    grid.appendChild(el);
  });
}

function toggleCard(id) {
  const body = document.getElementById(`body-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  body.classList.toggle("open");
  chev.classList.toggle("open");
}

function switchTab(cardId, idx) {
  const body = document.getElementById(`body-${cardId}`);
  body.querySelectorAll(".tab").forEach((t, i) => t.classList.toggle("active", i === idx));
  body.querySelectorAll(".tab-content").forEach((t, i) => t.classList.toggle("active", i === idx));
}

document.getElementById("filterBar").addEventListener("click", e => {
  if (!e.target.dataset.filter) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  renderCards(e.target.dataset.filter);
});

renderCards("all");
</script>
</body>
</html>
